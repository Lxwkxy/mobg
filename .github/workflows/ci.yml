name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_AUTH_URL: http://localhost:5000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install browser test dependencies
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test web flows and responsive layouts
        working-directory: .
        env:
          RESPONSIVE_BASE_URL: http://127.0.0.1:3100
          COMMENTS_WEB_URL: http://127.0.0.1:3100
          RESPONSIVE_OUTPUT: web/.next/responsive
        run: |
          npm --prefix web run start -- --hostname 127.0.0.1 --port 3100 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 "$RESPONSIVE_BASE_URL/login" > /dev/null
          node --test web/test/rPai03.mjs web/test/responsive.mjs web/test/task-comments.mjs

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mobg_ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobg_ci -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: mobg_ci
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: postgres
      BETTER_AUTH_URL: http://localhost:5000
      CORS_ORIGIN: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:tests
      - name: Build
        run: npm run build
      - name: Test with PostgreSQL
        run: npm run test:db
