name: Matt skill review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: matt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Matt review
    if: >-
      vars.MATT_REVIEW_ENABLED == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out the PR head and full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Prepare the skill prompt and issue context
        run: node .github/codex/prepare-matt-review.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Review with Matt's code-review skill
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/matt-review-prompt.md
          output-file: ${{ runner.temp }}/matt-review-report.md
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral", "--json"]'

  publish:
    name: Publish Matt review
    needs: review
    if: needs.review.outputs.report != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Update the review comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REVIEW_REPORT: ${{ needs.review.outputs.report }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.head.sha !== process.env.REVIEW_HEAD) {
              core.info('PR closed or new commits arrived; skipping the outdated report.');
              return;
            }
            const marker = '<!-- mobg-matt-review -->';
            const report = process.env.REVIEW_REPORT;
            if (report.length > 60000) throw new Error('Review exceeds the PR comment size limit.');
            const body = `${marker}\n## Matt skill review\n\nReviewed commit: \`${process.env.REVIEW_HEAD}\`\n\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
